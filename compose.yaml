services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: credit_scoring
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit_scoring"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

